rules:
- id: custom.gap-jwt-token-forgery-kotlin
  languages:
  - kotlin
  message: Insecure JWT handling detected in Kotlin. Calling parse() without signature
    verification, using algorithm "none", or decoding without verification allows
    attackers to forge tokens and impersonate users. Always use parseClaimsJws() with
    a signing key and restrict accepted algorithms (CWE-347, CWE-345, CWE-290).
  metadata:
    category: Authentication & Authorization
    cwe: CWE-347|CWE-345|CWE-290
    subcategory: JWT Token Forgery
  pattern-either:
  - pattern: Jwts.parser().parse($TOKEN)
  - pattern: Jwts.parserBuilder().build().parse($TOKEN)
  - pattern: Jwts.parserBuilder().build().parseClaimsJwt($TOKEN)
  - pattern: JWT.decode($TOKEN)
  - pattern: $PARSER.setSigningKey("...")
  - pattern: Jwts.builder().signWith($ALG, "...")
  severity: CRITICAL
- id: custom.gap-jwt-token-forgery-xml
  languages:
  - xml
  message: A JWT secret or token value appears to be stored as a plain-text Android
    string resource. Hardcoding secrets in XML resources exposes them to anyone who
    decompiles the APK. Store secrets server-side or use Android Keystore (CWE-347,
    CWE-321, CWE-290).
  metadata:
    category: Authentication & Authorization
    cwe: CWE-347|CWE-345|CWE-290
    subcategory: JWT Token Forgery
  pattern-either:
  - pattern: '<string name="jwt_secret">...</string>

      '
  - pattern: '<string name="jwt_key">...</string>

      '
  - pattern: '<string name="jwt_token">...</string>

      '
  severity: MEDIUM
- id: custom.gap-ace-third-party-libs-kotlin
  languages:
  - kotlin
  message: Arbitrary code execution risk via dynamic class loading or shell execution.
    DexClassLoader, PathClassLoader, Runtime.exec, and reflective invocation can execute
    attacker-controlled code if inputs are not strictly validated. Use only trusted,
    pinned library sources and avoid dynamic code loading at runtime (CWE-94, CWE-78,
    CWE-829, CWE-502).
  metadata:
    category: Mobile App Security
    cwe: CWE-94|CWE-78|CWE-829|CWE-502
    subcategory: Arbitrary Code Execution via third party libs
  pattern-either:
  - pattern: DexClassLoader($PATH, ...)
  - pattern: PathClassLoader($PATH, ...)
  - pattern: Runtime.getRuntime().exec(...)
  - pattern: ProcessBuilder($CMD)
  - pattern: Class.forName($CLASS)
  - pattern: ObjectInputStream($STREAM).readObject()
  - pattern: $METHOD.invoke($OBJ, ...)
  severity: CRITICAL
- id: custom.gap-ace-third-party-libs-xml
  languages:
  - xml
  message: The AndroidManifest declares permissions or features that enable installation
    of packages or loading of native/dynamic code from external sources. This increases
    the attack surface for arbitrary code execution via malicious third-party libraries
    (CWE-94, CWE-829).
  metadata:
    category: Mobile App Security
    cwe: CWE-94|CWE-78|CWE-829|CWE-502
    subcategory: Arbitrary Code Execution via third party libs
  pattern-either:
  - pattern: '<uses-permission android:name="android.permission.INSTALL_PACKAGES"
      .../>

      '
  - pattern: '<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"
      .../>

      '
  - pattern: '<uses-feature android:name="android.hardware.type.embedded" .../>

      '
  severity: HIGH
- id: custom.gap-insecure-content-provider-kotlin
  languages:
  - kotlin
  message: A ContentProvider is queried or mutated without enforcing caller permissions.
    Exported providers accessible to any app can leak or corrupt sensitive data. Check
    enforceCallingPermission() or declare read/write permissions on the provider (CWE-926,
    CWE-925, CWE-284).
  metadata:
    category: Mobile App Security
    cwe: CWE-926|CWE-925|CWE-284
    subcategory: Insecure Content Provider
  pattern-either:
  - pattern: 'context.contentResolver.query($URI, ...)

      '
  - pattern: 'context.contentResolver.insert($URI, ...)

      '
  - pattern: 'context.contentResolver.update($URI, ...)

      '
  - pattern: 'context.contentResolver.delete($URI, ...)

      '
  - pattern: enforceCallingOrSelfPermission(null, ...)
  - pattern: enforceCallingOrSelfUriPermission($URI, 0, ...)
  severity: HIGH
- id: custom.gap-insecure-content-provider-xml
  languages:
  - xml
  message: A ContentProvider is exported without android:permission, android:readPermission,
    or android:writePermission. Any installed application can read or write its data.
    Add explicit permissions to restrict access (CWE-926, CWE-925, CWE-284).
  metadata:
    category: Mobile App Security
    cwe: CWE-926|CWE-925|CWE-284
    subcategory: Insecure Content Provider
  pattern: '<provider android:exported="true" ...>...</provider>

    '
  severity: HIGH
- id: custom.gap-predictable-endpoints-kotlin
  languages:
  - kotlin
  message: Predictable or sequential identifiers used in URI or endpoint construction
    allow attackers to enumerate resources via IDOR. Use cryptographically random
    UUIDs (UUID.randomUUID()) and enforce server-side authorization checks on every
    request (CWE-330, CWE-284, CWE-425).
  metadata:
    category: Authentication & Authorization
    cwe: CWE-330|CWE-284|CWE-425
    subcategory: Predictable Endpoints
  pattern-either:
  - pattern: Uri.parse(".../$ID")
  - pattern: 'val $URL = "$BASE/" + $ID

      '
  - pattern: 'val $URL = "$BASE/" + $COUNTER++

      '
  - pattern: Random().nextInt(...)
  - pattern: System.currentTimeMillis()
  severity: MEDIUM
- id: custom.gap-predictable-endpoints-xml
  languages:
  - xml
  message: A deep-link intent-filter exposes a URI pattern that may allow unauthenticated
    or predictable access to internal app screens. Validate all deep-link parameters
    server-side and require authentication before acting on them (CWE-330, CWE-425).
  metadata:
    category: Authentication & Authorization
    cwe: CWE-330|CWE-284|CWE-425
    subcategory: Predictable Endpoints
  pattern-either:
  - pattern: '<data android:scheme="http" .../>

      '
  - pattern: '<data android:scheme="https" android:host="*" .../>

      '
  - pattern: '<action android:name="android.intent.action.VIEW" .../>

      '
  severity: MEDIUM
- id: custom.gap-unprotected-data-uri-webview-kotlin
  languages:
  - kotlin
  message: 'WebView loads a data: URI or has file-system access enabled without restriction.
    Attackers who control the URL can execute arbitrary JavaScript or read local files.
    Disable setAllowFileAccess, setAllowUniversalAccessFromFileURLs, and validate
    any URL before loading (CWE-79, CWE-200).'
  metadata:
    category: Mobile App Security
    cwe: CWE-79|CWE-200
    subcategory: Unprotected Data URIs in Webview
  pattern-either:
  - pattern: $WV.loadUrl("data:...")
  - pattern: $WV.loadDataWithBaseURL($BASE, ...)
  - pattern: $WV.settings.allowFileAccess = true
  - pattern: $WV.settings.allowUniversalAccessFromFileURLs = true
  - pattern: $WV.settings.allowFileAccessFromFileURLs = true
  - pattern: $WV.settings.javaScriptEnabled = true
  - pattern: $WV.loadUrl($URL)
  severity: HIGH
- id: custom.gap-unprotected-data-uri-webview-xml
  languages:
  - xml
  message: 'A WebView Activity or component is exported or declared without input-validation
    safeguards. Exported WebView components can be driven by third-party apps to load
    attacker-controlled data: or file: URIs (CWE-79, CWE-200).'
  metadata:
    category: Mobile App Security
    cwe: CWE-79|CWE-200
    subcategory: Unprotected Data URIs in Webview
  pattern: '<activity android:exported="true" ...>...</activity>

    '
  severity: HIGH
- id: custom.gap-local-file-theft-chooser-kotlin
  languages:
  - kotlin
  message: An Intent created with a raw file:// URI or via Uri.fromFile() is passed
    to a chooser or sent to external apps. Any receiving app gains read access to
    that local file path. Use FileProvider.getUriForFile() with a narrow file_paths.xml
    configuration and grant-uri-permissions flags instead (CWE-22, CWE-200).
  metadata:
    category: Mobile App Security
    cwe: CWE-22|CWE-200
    subcategory: Theft of Local Files via ChooserActivity
  pattern-either:
  - pattern: Uri.fromFile($FILE)
  - pattern: Intent.createChooser($INTENT, ...)
  - pattern: '$INTENT.setData(Uri.fromFile($FILE))

      '
  - pattern: '$INTENT.putExtra($KEY, Uri.fromFile($FILE))

      '
  - pattern: FileProvider.getUriForFile($CTX, $AUTH, $FILE)
  severity: HIGH
- id: custom.gap-local-file-theft-chooser-xml
  languages:
  - xml
  message: A ChooserActivity or file-sharing Activity is exported without restricting
    the URI schemes it accepts. This can allow third-party apps to trigger file selection
    over arbitrary local paths and exfiltrate device files (CWE-22, CWE-200).
  metadata:
    category: Mobile App Security
    cwe: CWE-22|CWE-200
    subcategory: Theft of Local Files via ChooserActivity
  pattern-either:
  - pattern: '<activity android:name="android.intent.action.CHOOSER" ...>...</activity>

      '
  - pattern: '<data android:scheme="file" .../>

      '
  severity: HIGH
- id: custom.gap-insecure-broadcast-receiver-kotlin
  languages:
  - kotlin
  message: A BroadcastReceiver is registered or a broadcast is sent without enforcing
    a permission. Any application can send malicious intents to an unprotected receiver
    or intercept unprotected broadcasts. Always specify a permission string in registerReceiver()
    and sendBroadcast() calls (CWE-926, CWE-284).
  metadata:
    category: Mobile App Security
    cwe: CWE-926|CWE-284
    subcategory: Insecure Broadcast Receiver
  pattern-either:
  - pattern: registerReceiver($RECEIVER, $FILTER)
  - pattern: registerReceiver($RECEIVER, $FILTER, null, ...)
  - pattern: sendBroadcast($INTENT)
  - pattern: sendOrderedBroadcast($INTENT, null)
  - pattern: LocalBroadcastManager.getInstance($CTX).registerReceiver(...)
  severity: HIGH
- id: custom.gap-insecure-broadcast-receiver-xml
  languages:
  - xml
  message: A BroadcastReceiver is declared with android:exported="true" and no android:permission
    attribute. Any application on the device can send it arbitrary intents. Add a
    signature-level or custom permission to restrict access (CWE-926, CWE-284).
  metadata:
    category: Mobile App Security
    cwe: CWE-926|CWE-284
    subcategory: Insecure Broadcast Receiver
  pattern: '<receiver android:exported="true" ...>...</receiver>

    '
  severity: HIGH
- id: custom.gap-insecure-fileprovider-paths-kotlin
  languages:
  - kotlin
  message: FileProvider.getUriForFile() is used to share files. If the backing file_paths.xml
    exposes root-path or an overly broad directory, any file on the device can be
    shared with external apps. Scope file_paths.xml to the minimum required directories
    and filenames (CWE-22, CWE-552).
  metadata:
    category: Mobile App Security
    cwe: CWE-22|CWE-552
    subcategory: Insecure use of FileProvider Paths
  pattern-either:
  - pattern: FileProvider.getUriForFile($CTX, $AUTHORITY, $FILE)
  - pattern: '$INTENT.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)

      '
  - pattern: '$INTENT.addFlags(Intent.FLAG_GRANT_WRITE_URI_PERMISSION)

      '
  severity: HIGH
- id: custom.gap-insecure-fileprovider-paths-xml
  languages:
  - xml
  message: The FileProvider paths configuration exposes a root-path, external-path,
    or files-path with a broad path="/". This grants access to the entire storage
    area. Restrict each path entry to the narrowest required directory (CWE-22, CWE-552).
  metadata:
    category: Mobile App Security
    cwe: CWE-22|CWE-552
    subcategory: Insecure use of FileProvider Paths
  pattern-either:
  - pattern: '<root-path name="..." path="..." .../>

      '
  - pattern: '<external-path name="..." path="/" .../>

      '
  - pattern: '<files-path name="..." path="/" .../>

      '
  - pattern: '<cache-path name="..." path="/" .../>

      '
  - pattern: '<external-files-path name="..." path="/" .../>

      '
  severity: HIGH
- id: custom.gap-implicit-intent-sensitive-data-kotlin
  languages:
  - kotlin
  message: An implicit Intent is created and sensitive data (credentials, tokens,
    or PII) is attached as an extra. Any app that registers a matching intent-filter
    can intercept this broadcast and read the sensitive payload. Use explicit Intents
    with a specific component or use LocalBroadcastManager for intra-app communication
    (CWE-926, CWE-200).
  metadata:
    category: Mobile App Security
    cwe: CWE-926|CWE-200
    subcategory: Implicit Intent with sensitive data
  pattern-either:
  - pattern: 'val $INTENT = Intent($ACTION)

      ...

      $INTENT.putExtra($KEY, $PASSWORD)

      '
  - pattern: 'Intent($ACTION).putExtra($KEY, $VAL)

      '
  - patterns:
    - pattern: $INTENT.putExtra($KEY, $VAL)
    - pattern-not: $INTENT.setComponent(...)
    - pattern-not: $INTENT.setClass(...)
    - pattern-not: $INTENT.setClassName(...)
    - metavariable-regex:
        metavariable: $KEY
        regex: (?i).*(password|passwd|token|secret|credential|auth|apikey|api_key|ssn|pin).*
  severity: HIGH
- id: custom.gap-implicit-intent-sensitive-data-xml
  languages:
  - xml
  message: An activity or receiver is exported and declares an implicit intent-filter
    without restricting access. Any external application can send intents to this
    component and potentially extract sensitive data. Set android:exported="false"
    or add permission enforcement (CWE-926, CWE-200).
  metadata:
    category: Mobile App Security
    cwe: CWE-926|CWE-200
    subcategory: Implicit Intent with sensitive data
  pattern-either:
  - pattern: "<receiver android:exported=\"true\" ...>\n  <intent-filter>...</intent-filter>\n\
      </receiver>\n"
  - pattern: "<activity android:exported=\"true\" ...>\n  <intent-filter>...</intent-filter>\n\
      </activity>\n"
  severity: HIGH
- id: custom.gap-implicit-intent-arbitrary-url-kotlin
  languages:
  - kotlin
  message: 'An implicit Intent with ACTION_VIEW is constructed using an unvalidated
    URL sourced from an incoming Intent or external input. A malicious app can intercept
    this intent or supply a javascript: / file: scheme URL, leading to open redirect
    or arbitrary code execution in a WebView (CWE-601, CWE-926).'
  metadata:
    category: Mobile App Security
    cwe: CWE-601|CWE-926
    subcategory: Intercepting Implicit Intent to load arbitrary URL
  mode: taint
  pattern-sinks:
  - patterns:
    - pattern: Intent(Intent.ACTION_VIEW, Uri.parse($URL))
    - focus-metavariable: $URL
  - patterns:
    - pattern: $INTENT.setData(Uri.parse($URL))
    - focus-metavariable: $URL
  - patterns:
    - pattern: $WEBVIEW.loadUrl($URL)
    - focus-metavariable: $URL
  pattern-sources:
  - pattern: intent.getStringExtra(...)
  - pattern: intent.data
  - pattern: intent.dataString
  - pattern: $INTENT.getStringExtra(...)
  - pattern: $INTENT.data
  severity: HIGH
- id: custom.gap-implicit-intent-arbitrary-url-xml
  languages:
  - xml
  message: An activity exposes a broad intent-filter accepting VIEW actions on http/https
    schemes without restricting the host. A malicious app can fire an implicit Intent
    to this component and supply an attacker-controlled URL, enabling open redirect
    (CWE-601, CWE-926). Restrict the host with android:host or use an explicit Intent.
  metadata:
    category: Mobile App Security
    cwe: CWE-601|CWE-926
    subcategory: Intercepting Implicit Intent to load arbitrary URL
  pattern: "<intent-filter>\n  <action android:name=\"android.intent.action.VIEW\"\
    \ />\n  <data android:scheme=\"http\" />\n</intent-filter>\n"
  severity: MEDIUM
- id: custom.gap-insecure-logging-credentials-kotlin
  languages:
  - kotlin
  message: Sensitive data such as passwords, tokens, or credentials is being written
    to the Android system log. Device logs can be read by other apps with READ_LOGS
    permission or via adb. Remove logging of sensitive fields in production builds
    and use obfuscated/sanitized log messages (CWE-312, CWE-359).
  metadata:
    category: Mobile App Security
    cwe: unknown
    subcategory: Insecure Logging of Credentials
  pattern-either:
  - patterns:
    - pattern: Log.$LEVEL($TAG, $MSG)
    - metavariable-regex:
        metavariable: $MSG
        regex: (?i).*(password|passwd|token|secret|credential|auth|apikey|api_key|pin|ssn).*
  - patterns:
    - pattern: Log.$LEVEL($TAG, $MSG)
    - metavariable-regex:
        metavariable: $TAG
        regex: (?i).*(password|passwd|token|secret|credential|auth|apikey|pin).*
  - pattern: Log.$LEVEL($TAG, "..." + $PASSWORD + "...")
  - pattern: println($CRED)
  severity: HIGH
- id: custom.gap-insecure-logging-credentials-xml
  languages:
  - xml
  message: The AndroidManifest sets android:debuggable="true", which enables verbose
    logging and allows adb access to the application sandbox. Sensitive data written
    to logcat becomes accessible to any app with READ_LOGS. Ensure debuggable is false
    in production builds (CWE-312).
  metadata:
    category: Mobile App Security
    cwe: unknown
    subcategory: Insecure Logging of Credentials
  pattern: '<application android:debuggable="true" ...>...</application>

    '
  severity: MEDIUM
- id: custom.gap-null-byte-bypass-js
  languages:
  - javascript
  - typescript
  message: User-supplied input is used in registration or validation logic without
    stripping null bytes or checking for empty/whitespace-only values. Attackers can
    bypass uniqueness checks or inject a null byte to truncate strings at the filesystem
    or database layer. Validate, trim, and reject inputs containing null bytes (CWE-20,
    CWE-158).
  metadata:
    category: Improper Input Validation
    cwe: CWE-20|CWE-158
    subcategory: Empty user registration or poison null byte bypass
  mode: taint
  pattern-sinks:
  - patterns:
    - pattern: $DB.findOne($QUERY)
    - focus-metavariable: $QUERY
  - patterns:
    - pattern: $DB.find($QUERY)
    - focus-metavariable: $QUERY
  - patterns:
    - pattern: $DB.create($DATA)
    - focus-metavariable: $DATA
  - patterns:
    - pattern: $MODEL.findOrCreate($OPTS)
    - focus-metavariable: $OPTS
  pattern-sources:
  - pattern: req.body.$FIELD
  - pattern: req.query.$FIELD
  - pattern: req.params.$FIELD
  severity: HIGH
- id: custom.gap-null-byte-bypass-python
  languages:
  - python
  message: User-supplied input flows into a database query or file operation without
    null-byte stripping or empty-string validation. Attackers can register empty usernames
    or inject null bytes to bypass uniqueness and length constraints (CWE-20, CWE-158).
  metadata:
    category: Improper Input Validation
    cwe: CWE-20|CWE-158
    subcategory: Empty user registration or poison null byte bypass
  mode: taint
  pattern-sinks:
  - patterns:
    - pattern: $MODEL.objects.get($QUERY)
    - focus-metavariable: $QUERY
  - patterns:
    - pattern: $MODEL.objects.filter($QUERY)
    - focus-metavariable: $QUERY
  - patterns:
    - pattern: $MODEL.objects.create($DATA)
    - focus-metavariable: $DATA
  - patterns:
    - pattern: $SESSION[$KEY] = $VAL
    - focus-metavariable: $VAL
  pattern-sources:
  - pattern: request.form.get(...)
  - pattern: request.args.get(...)
  - pattern: request.json.get(...)
  - pattern: request.data
  severity: HIGH
- id: custom.gap-null-byte-bypass-yaml
  languages:
  - yaml
  message: A configuration entry appears to allow empty or null values for fields
    that should be required (such as username, password, or role). This can enable
    null-byte or empty-registration bypasses at runtime (CWE-20, CWE-158).
  metadata:
    category: Improper Input Validation
    cwe: CWE-20|CWE-158
    subcategory: Empty user registration or poison null byte bypass
  pattern-either:
  - pattern: "validation:\n  required: false\n"
  - pattern: 'allow_empty: true

      '
  - pattern: 'minLength: 0

      '
  severity: MEDIUM
- id: custom.gap-null-byte-bypass-xml
  languages:
  - xml
  message: A validation constraint in configuration allows empty or zero-length input
    for a sensitive field. Attackers may exploit this to register empty usernames
    or bypass field uniqueness checks (CWE-20, CWE-158).
  metadata:
    category: Improper Input Validation
    cwe: CWE-20|CWE-158
    subcategory: Empty user registration or poison null byte bypass
  pattern-either:
  - pattern: '<field name="..." required="false" />

      '
  - pattern: '<constraint type="NotBlank" enabled="false" />

      '
  - pattern: '<validation minlength="0" />

      '
  severity: MEDIUM
- id: custom.gap-ssti-js
  languages:
  - javascript
  - typescript
  message: User-controlled input is passed directly to a server-side template rendering
    function. An attacker can inject template directives to execute arbitrary code
    on the server (CWE-94, CWE-1336). Never render untrusted input as a template string;
    pass it as data context only.
  metadata:
    category: Injection
    cwe: CWE-94|CWE-1336
    subcategory: Dynamic SSTi (server template injection)
  mode: taint
  pattern-sinks:
  - patterns:
    - pattern: $NUNJUCKS.renderString($TMPL, ...)
    - focus-metavariable: $TMPL
  - patterns:
    - pattern: $EJS.render($TMPL, ...)
    - focus-metavariable: $TMPL
  - patterns:
    - pattern: $HANDLEBARS.compile($TMPL)
    - focus-metavariable: $TMPL
  - patterns:
    - pattern: $PUG.render($TMPL, ...)
    - focus-metavariable: $TMPL
  - patterns:
    - pattern: $LODASH.template($TMPL)
    - focus-metavariable: $TMPL
  pattern-sources:
  - pattern: req.body.$INPUT
  - pattern: req.query.$INPUT
  - pattern: req.params.$INPUT
  severity: CRITICAL
- id: custom.gap-ssti-python
  languages:
  - python
  message: User-controlled input is passed to a template engine's render or from_string
    method. Attackers can inject Jinja2/Mako/Chameleon directives to read files or
    execute arbitrary code (CWE-94, CWE-1336). Pass user data only as template variables,
    never as the template string itself.
  metadata:
    category: Injection
    cwe: CWE-94|CWE-1336
    subcategory: Dynamic SSTi (server template injection)
  mode: taint
  pattern-sinks:
  - patterns:
    - pattern: jinja2.Environment(...).from_string($TMPL)
    - focus-metavariable: $TMPL
  - patterns:
    - pattern: jinja2.Template($TMPL)
    - focus-metavariable: $TMPL
  - patterns:
    - pattern: Template($TMPL).render(...)
    - focus-metavariable: $TMPL
  - patterns:
    - pattern: render_template_string($TMPL, ...)
    - focus-metavariable: $TMPL
  - patterns:
    - pattern: mako.template.Template($TMPL)
    - focus-metavariable: $TMPL
  pattern-sources:
  - pattern: request.args.get(...)
  - pattern: request.form.get(...)
  - pattern: request.json.get(...)
  severity: CRITICAL
- id: custom.gap-ssti-yaml
  languages:
  - yaml
  message: A configuration value uses a Go/Helm/Jinja2 template expression that may
    interpolate unsanitized external input. Template injection in pipeline or Helm
    chart configuration can lead to code execution during rendering (CWE-94, CWE-1336).
  metadata:
    category: Injection
    cwe: CWE-94|CWE-1336
    subcategory: Dynamic SSTi (server template injection)
  pattern-either:
  - pattern: 'template: "{{- $VAR }}"

      '
  - pattern: 'value: "{{ $INPUT }}"

      '
  - pattern: 'content: "{% $BLOCK %}"

      '
  severity: HIGH
- id: custom.gap-ssti-xml
  languages:
  - xml
  message: An XML configuration attribute or element value contains a template expression
    that may interpolate user-supplied input. If the template engine renders these
    values with unsanitized data, server-side template injection is possible (CWE-94,
    CWE-1336).
  metadata:
    category: Injection
    cwe: CWE-94|CWE-1336
    subcategory: Dynamic SSTi (server template injection)
  pattern-either:
  - pattern: '<property name="..." value="${ $EXPR }" />

      '
  - pattern: '<param name="..." value="${ $EXPR }" />

      '
  severity: HIGH
- id: custom.gap-wallet-logic-flaw-js
  languages:
  - javascript
  - typescript
  message: A wallet balance, score, or financial amount is modified using a value
    sourced directly from user input without server-side validation or authorization
    checks. Attackers can supply negative amounts or overflow values to deplete wallets
    or inflate scores (CWE logic flaw). Always recompute monetary values server-side
    and enforce range/ownership checks.
  metadata:
    category: Miscellaneous
    cwe: unknown
    subcategory: Wallet depletion or score board logic flaws
  mode: taint
  pattern-sinks:
  - patterns:
    - pattern: $OBJ.balance += $AMOUNT
    - focus-metavariable: $AMOUNT
  - patterns:
    - pattern: $OBJ.balance -= $AMOUNT
    - focus-metavariable: $AMOUNT
  - patterns:
    - pattern: $OBJ.score += $POINTS
