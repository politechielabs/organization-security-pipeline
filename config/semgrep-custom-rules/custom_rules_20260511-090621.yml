  - id: custom.gap-overly-permissive-gha-contents-write
    languages: [generic]
    severity: HIGH
    message: >-
      This GitHub Actions workflow grants contents:write permission at the job or workflow
      level. This allows any step in the workflow — including compromised third-party
      actions — to push commits, create releases, or overwrite refs in the repository.
      Scope permissions to the minimum required (e.g., contents:read) and elevate only
      in the specific job step that requires write access (CWE-732).
    metadata:
      cwe: CWE-732
      category: Injection
      subcategory: Overly Permissive GitHub Actions Permissions (contents: write)
    paths:
      include:
        - .github/workflows/*.yml
        - .github/workflows/*.yaml
    pattern: |
      permissions:
        ...
        contents: write

