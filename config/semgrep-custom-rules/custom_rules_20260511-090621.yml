  - id: custom.gap-predictable-password-reset-token-md5-py
    languages: [python]
    severity: HIGH
    message: >-
      A password-reset token is derived by hashing a timestamp with MD5. Timestamps are
      trivially guessable, and MD5 is not a suitable CSPRNG substitute. An attacker can
      enumerate candidate tokens within a narrow time window and take over any account.
      Use secrets.token_urlsafe() or os.urandom() for cryptographically strong tokens
      (CWE-340).
    metadata:
      cwe: CWE-340
      category: Crypto
      subcategory: Predictable Password Reset Token (Timestamp-Based MD5)
    mode: taint
    pattern-sources:
      - pattern: time.time()
      - pattern: time.time_ns()
      - pattern: time.monotonic()
      - pattern: datetime.datetime.now()
      - pattern: datetime.datetime.utcnow()
      - pattern: datetime.datetime.today()
      - pattern: datetime.now()
      - pattern: datetime.utcnow()
    pattern-sinks:
      - patterns:
          - pattern: hashlib.md5($DATA)
          - focus-metavariable: $DATA
      - patterns:
          - pattern: hashlib.md5($DATA, ...)
          - focus-metavariable: $DATA
      - patterns:
          - pattern: hashlib.new("md5", $DATA)
          - focus-metavariable: $DATA
      - patterns:
          - pattern: hashlib.new("md5", $DATA, ...)
          - focus-metavariable: $DATA
      - patterns:
          - pattern: md5($DATA)
          - focus-metavariable: $DATA
      - patterns:
          - pattern: md5($DATA).hexdigest()
          - focus-metavariable: $DATA


