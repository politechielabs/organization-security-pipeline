  - id: custom.gap-weak-hash-md5-password-py
    languages: [python]
    severity: HIGH
    message: >-
      MD5 is a cryptographically broken hash function and must not be used for password
      hashing. Its speed and known collision vulnerabilities allow offline brute-force and
      rainbow-table attacks. Replace with a memory-hard password hashing function such as
      bcrypt, scrypt, or argon2 (CWE-328).
    metadata:
      cwe: CWE-328
      category: Crypto
      subcategory: Use of Weak Hash Algorithm (MD5) for Password Hashing
    pattern-either:
      - pattern: hashlib.md5(...)
      - pattern: hashlib.new("md5", ...)
      - pattern: |-
          hashlib.new('md5', ...)
      - pattern: hashlib.new("MD5", ...)
      - pattern: |-
          hashlib.new('MD5', ...)
      - patterns:
          - pattern: $H = hashlib.new($ALG, ...)
          - pattern-where-python: 'vars["$ALG"].lower() == "md5"'
      - pattern: Crypto.Hash.MD5.new(...)
      - pattern: Cryptodome.Hash.MD5.new(...)
      - pattern: passlib.hash.md5_crypt.hash(...)
      - pattern: passlib.hash.md5_crypt.encrypt(...)


