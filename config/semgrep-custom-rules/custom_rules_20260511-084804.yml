# Auto-generated from run #15 — 20260511-084804
rules:
- id: custom.gap-sql-injection-string-concat-py
  languages:
  - python
  message: User-controlled input flows directly into a SQL query. An attacker can
    manipulate the query to read, modify, or delete arbitrary data. Use parameterized
    queries (passing values as the second argument to execute) or an ORM instead of
    building queries with user-supplied strings (CWE-89).
  metadata:
    category: Injection
    cwe: CWE-89
    subcategory: SQL Injection via String Concatenation
  mode: taint
  pattern-sinks:
  - patterns:
    - pattern: $CURSOR.execute($QUERY, ...)
    - focus-metavariable: $QUERY
  - patterns:
    - pattern: $CURSOR.executemany($QUERY, ...)
    - focus-metavariable: $QUERY
  - patterns:
    - pattern: $CONN.execute($QUERY, ...)
    - focus-metavariable: $QUERY
  - patterns:
    - pattern: $SESSION.execute($QUERY, ...)
    - focus-metavariable: $QUERY
  - patterns:
    - pattern: $DB.raw($QUERY, ...)
    - focus-metavariable: $QUERY
  pattern-sources:
  - pattern: request.args.get(...)
  - pattern: request.args[$KEY]
  - pattern: request.form.get(...)
  - pattern: request.form[$KEY]
  - pattern: request.json.get(...)
  - pattern: request.json[$KEY]
  - pattern: request.values.get(...)
  - pattern: request.get_json()
  - pattern: request.data
  severity: CRITICAL
- id: custom.gap-md5-password-hashing-py
  languages:
  - python
  message: MD5 is a cryptographically broken algorithm and must not be used for password
    hashing. Its short digest length and known collision vulnerabilities make it trivially
    reversible via rainbow tables and GPU-accelerated brute force. Replace with a
    dedicated password hashing function such as bcrypt, scrypt, or Argon2 via the
    passlib or argon2-cffi libraries (CWE-327).
  metadata:
    category: Crypto
    cwe: CWE-327
    subcategory: Use of MD5 for Password Hashing (Weak Cryptographic Algorithm)
  pattern-either:
  - pattern: hashlib.md5(...)
  - pattern: hashlib.new("md5", ...)
  - pattern: hashlib.new('md5', ...)
  - pattern: MD5.new(...)
  - pattern: Crypto.Hash.MD5.new(...)
  severity: HIGH
- id: custom.gap-mass-assignment-discount-py
  languages:
  - python
  message: User-controlled request data is spread or directly applied to a model or
    object without an explicit allowlist. An attacker can supply arbitrary field names
    — including sensitive fields such as discount, role, or is_admin — to manipulate
    application state. Explicitly extract and validate only the fields your endpoint
    accepts before applying them to any model or database record (CWE-915).
  metadata:
    category: Auth
    cwe: CWE-915
    subcategory: Mass Assignment — User-Controlled Discount Field
  pattern-either:
  - pattern: $MODEL(**request.get_json())
  - pattern: $MODEL(**request.json)
  - pattern: $MODEL(**request.form)
  - pattern: $OBJ.update(**request.get_json())
  - pattern: $OBJ.update(**request.json)
  - pattern: $OBJ.update(**request.form)
  - pattern: $OBJ.__dict__.update(request.get_json())
  - pattern: $OBJ.__dict__.update(request.json)
  - pattern: setattr($OBJ, $FIELD, request.json.get(...))
  - pattern: setattr($OBJ, $FIELD, request.form.get(...))
  - pattern: setattr($OBJ, $FIELD, request.args.get(...))
  severity: HIGH
- id: custom.gap-predictable-password-reset-token-py
  languages:
  - python
  message: Password reset token generated by hashing a timestamp with MD5. Timestamps
    are predictable and low-entropy, allowing an attacker to brute-force or enumerate
    valid reset tokens. Replace with secrets.token_urlsafe() or os.urandom() for cryptographically
    secure token generation (CWE-340).
  metadata:
    category: Crypto
    cwe: CWE-340
    subcategory: Predictable Password Reset Token (Timestamp-Based MD5)
  mode: taint
  pattern-sinks:
  - patterns:
    - pattern: hashlib.md5($DATA)
    - focus-metavariable: $DATA
  - patterns:
    - pattern: hashlib.md5($DATA, ...)
    - focus-metavariable: $DATA
  - patterns:
    - pattern: hashlib.new("md5", $DATA)
    - focus-metavariable: $DATA
  - patterns:
    - pattern: hashlib.new("md5", $DATA, ...)
    - focus-metavariable: $DATA
  - patterns:
    - pattern: md5($DATA)
    - focus-metavariable: $DATA
  pattern-sources:
  - pattern: time.time()
  - pattern: time.time_ns()
  - pattern: datetime.datetime.now()
  - pattern: datetime.now()
  - pattern: int(time.time())
  - pattern: str(time.time())
  severity: HIGH
- id: custom.gap-missing-authz-account-deletion-py
  languages:
  - python
  message: Account or user deletion performed without an apparent authorization check.
    Without verifying that the requester owns or has permission to delete the target
    account, an attacker can delete arbitrary accounts (IDOR / broken access control).
    Enforce ownership or role-based permission checks before any destructive user
    operation (CWE-862).
  metadata:
    category: Auth
    cwe: CWE-862
    subcategory: Missing Authorization on Account Deletion
  patterns:
  - pattern-either:
    - pattern: '$USER.delete()

        '
    - pattern: 'db.session.delete($USER)

        '
    - pattern: 'User.objects.filter(...).delete()

        '
    - pattern: 'User.query.filter(...).delete()

        '
    - pattern: 'Account.objects.filter(...).delete()

        '
    - pattern: 'Account.query.filter(...).delete()

        '
  - pattern-not-inside: "if $CALLER.id == $TARGET:\n    ...\n"
  - pattern-not-inside: "if current_user.id == $TARGET:\n    ...\n"
  - pattern-not-inside: "if $X.is_authenticated:\n    ...\n"
  - pattern-not-inside: "if $X.has_perm(...):\n    ...\n"
  - pattern-not-inside: "if not $X.has_perm(...):\n    ...\n"
  - pattern-not-inside: "if $X.is_superuser:\n    ...\n"
  - pattern-not-inside: "if $X.is_staff:\n    ...\n"
  severity: CRITICAL
- id: custom.gap-overly-permissive-gha-workflow
  languages:
  - generic
  message: GitHub Actions workflow grants overly broad write permissions. Granting
    write-all or combining contents-write with actions-write violates the principle
    of least privilege and can allow a compromised action or pull-request to exfiltrate
    secrets, tamper with releases, or modify repository contents. Restrict each permission
    to the minimum required scope and prefer read-only defaults (CWE-250).
  metadata:
    category: Auth
    cwe: CWE-250
    subcategory: Overly Permissive GitHub Actions Workflow Permissions
  pattern-either:
  - pattern: 'permissions: write-all'
  - pattern: "permissions:\n  contents: write\n  actions: write\n"
  - pattern: "permissions:\n  contents: write\n  packages: write\n  actions: write\n"
  - pattern: "permissions:\n  deployments: write\n  actions: write\n  contents: write\n"
  severity: HIGH

