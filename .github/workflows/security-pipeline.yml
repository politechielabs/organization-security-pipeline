name: Security Pipeline


on:
  workflow_call:
    secrets:
      CLAUDE_API_KEY:
        required: true
      SEMGREP_RULES_REPO:
        required: false   # org/repo of shared Semgrep rules repo
      RULES_REPO_TOKEN:
        required: false   # PAT with write access to SEMGREP_RULES_REPO

  pull_request:
    branches: [main, staging, dev]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  security-events: write

# ─── Checkout pattern used by all scan jobs ───────────────────────────────────
# Step 1: Checkout CALLER's code → default workspace (GITHUB_WORKSPACE)
# Step 2: Checkout security_rep  → .security-tools/
#
# Scripts:  python .security-tools/scripts/run_reviewer.py
# Configs:  .security-tools/config/

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # L1 · Gitleaks — Secrets & Credentials
  # Blocks immediately on any secret/credential leak.
  # ────────────────────────────────────────────────────────────────────────────
  l1-gitleaks:
    name: "L1 · Gitleaks — Secrets"
    runs-on: ubuntu-latest
    # Job-level permissions are required for workflow_call compatibility.
    # Top-level permissions are ignored when this workflow is called from another repo.
    permissions:
      contents: read
      pull-requests: write   # gitleaks-action posts PR comments / annotations
    steps:
      - name: Checkout target code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so gitleaks can scan all PR commits

      - name: Checkout security tools
        uses: actions/checkout@v4
        with:
          repository: ${{ github.workflow_repository }}
          ref: ${{ github.workflow_sha }}
          path: .security-tools
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .security-tools/config/gitleaks.toml
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}  # uncomment for private repos on paid plan

  # ────────────────────────────────────────────────────────────────────────────
  # L2 · Trivy — SCA / CVE / Misconfigs
  # Blocks on CRITICAL or HIGH vulnerabilities in dependencies / IaC.
  # ────────────────────────────────────────────────────────────────────────────
  l2-trivy:
    name: "L2 · Trivy — SCA / CVE"
    runs-on: ubuntu-latest
    needs: l1-gitleaks
    permissions:
      contents: read
      security-events: write   # upload SARIF to GitHub Security tab
      pull-requests: write     # post PR annotations

    steps:
      - name: Checkout target code
        uses: actions/checkout@v4

      - name: Checkout security tools
        uses: actions/checkout@v4
        with:
          repository: ${{ github.workflow_repository }}
          ref: ${{ github.workflow_sha }}
          path: .security-tools
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.30.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: "CRITICAL,HIGH"
          exit-code: "1"          # blocks PR on CRITICAL/HIGH
          ignore-unfixed: true    # skip CVEs with no upstream fix (reduces noise)
          trivyignores: .trivyignore  # optional per-repo ignore list
          trivy-config: .security-tools/config/trivy-comprehensive.yaml

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()   # upload even when exit-code:1 fires so findings appear in Security tab
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  # ────────────────────────────────────────────────────────────────────────────
  # L3 · Semgrep — SAST (diff-aware)
  # Scans only changed source files. Blocks on ERROR-severity findings.
  # Pulls latest rules from SEMGREP_RULES_REPO secret if configured.
  # ────────────────────────────────────────────────────────────────────────────
  l3-semgrep:
    name: "L3 · Semgrep — SAST"
    runs-on: ubuntu-latest
    needs: l2-trivy

    steps:
      - name: Checkout target code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout security tools
        uses: actions/checkout@v4
        with:
          repository: ${{ github.workflow_repository }}
          ref: ${{ github.workflow_sha }}
          path: .security-tools
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Identify changed source files
        run: |
          git diff --name-only origin/${{ github.base_ref }}...HEAD \
            | grep -E '\.(py|js|ts|jsx|tsx|java|go|rb|php|cs|swift|kt|rs|sh|bash|sql|yml|yaml|toml|xml|cfg|ini|json)$' \
            | while read -r f; do [ -f "$f" ] && printf '%s\n' "$f"; done \
            > /tmp/semgrep_targets.txt

          echo "Files queued for Semgrep ($(wc -l < /tmp/semgrep_targets.txt)):"
          cat /tmp/semgrep_targets.txt

      - name: Pull external Semgrep rules
        if: ${{ secrets.SEMGREP_RULES_REPO != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth=1 \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ secrets.SEMGREP_RULES_REPO }}" \
            /tmp/semgrep-rules-external \
            || echo "Warning: external rules repo unavailable — using custom rules only"

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep
        run: |
          if [ ! -s /tmp/semgrep_targets.txt ]; then
            echo "No relevant files changed — skipping Semgrep"
            printf '{"version":"2.1.0","runs":[{"tool":{"driver":{"name":"semgrep","rules":[]}},"results":[]}]}\n' \
              > semgrep-results.sarif
            exit 0
          fi

          CONFIG_FLAGS="--config .security-tools/config/semgrep-custom-rules"
          [ -d /tmp/semgrep-rules-external ] && \
            CONFIG_FLAGS="$CONFIG_FLAGS --config /tmp/semgrep-rules-external"

          mapfile -t TARGET_FILES < /tmp/semgrep_targets.txt

          semgrep $CONFIG_FLAGS \
            --severity ERROR \
            --exit-code 1 \
            --sarif --output semgrep-results.sarif \
            "${TARGET_FILES[@]}"

      - name: Upload Semgrep SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep

  # ────────────────────────────────────────────────────────────────────────────
  # L4 · Claude — Semantic Triage + Semgrep Rule Generation
  # Runs run_reviewer.py --force against the caller's workspace.
  # --force bypasses L1-L3 gates (already enforced by the jobs above).
  # Claude posts INLINE review comments per finding — never blocks the PR.
  # CRITICAL/HIGH findings trigger automatic Semgrep rule generation + PR.
  # Skipped for security/ branches to prevent infinite rule-gen loops.
  # ────────────────────────────────────────────────────────────────────────────
  l4-claude:
    name: "L4 · Claude — Semantic Review + Rule Generation"
    runs-on: ubuntu-latest
    needs: l3-semgrep
    if: "!startsWith(github.head_ref, 'security/')"
    # continue even if findings are detected — L4 never blocks the PR
    continue-on-error: false
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout target code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout security tools
        uses: actions/checkout@v4
        with:
          repository: ${{ github.workflow_repository }}
          ref: ${{ github.workflow_sha }}
          path: .security-tools
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install anthropic pyyaml python-dotenv

      - name: Claude semantic analysis + inline review + rule generation
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SEMGREP_RULES_REPO: ${{ secrets.SEMGREP_RULES_REPO }}
          RULES_REPO_TOKEN: ${{ secrets.RULES_REPO_TOKEN }}
        run: python .security-tools/scripts/run_reviewer.py "$GITHUB_WORKSPACE" --force

      - name: Upload generated rules artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-semgrep-rules-${{ github.run_id }}
          path: /tmp/generated_rules.yml
          retention-days: 14
          if-no-files-found: ignore
