name: Security Pipeline


on:
  workflow_call:
    secrets:
      CLAUDE_API_KEY:
        required: true
      RULES_REPO_TOKEN:
        required: false   # PAT to read the security-pipeline repo from consumer repos

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

# ─── Checkout pattern used by all scan jobs ───────────────────────────────────
# Step 1: Checkout CALLER's code → default workspace (GITHUB_WORKSPACE)
# Step 2: Checkout security_rep  → .security-tools/
#
# Scripts:  python .security-tools/scripts/run_reviewer.py
# Configs:  .security-tools/config/

jobs:
# ────────────────────────────────────────────────────────────────────────────
  # L1 · Gitleaks — Secrets & Credentials
  # Uses binary directly — no gitleaks-action, no license required.
  # ────────────────────────────────────────────────────────────────────────────
  l1-gitleaks:
    name: "L1 · Gitleaks — Secrets"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout target code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout security tools
        uses: actions/checkout@v4
        with:
          repository: politechielabs/organization-security-pipeline
          ref: main
          path: .security-tools
          token: ${{ secrets.RULES_REPO_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Install Gitleaks binary
        run: |
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          tar -xzf gitleaks_8.24.3_linux_x64.tar.gz
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Initialize SARIF stubs and gitleaks ignore
        run: |
          EMPTY_SARIF='{"version":"2.1.0","runs":[{"tool":{"driver":{"name":"gitleaks","rules":[]}},"results":[]}]}'
          echo "$EMPTY_SARIF" > gitleaks-fs.sarif
          echo "$EMPTY_SARIF" > gitleaks-git.sarif
          # Exclude the checked-out security tools from scans
          # gitleaks v8 uses .gitleaksignore — --exclude-path flag does not exist
          echo '.security-tools/' >> .gitleaksignore

      - name: Scan filesystem for secrets
        # --no-git scans working tree only, not history
        run: |
          gitleaks detect \
            --config .security-tools/config/gitleaks.toml \
            --source . \
            --no-git \
            --exit-code 1 \
            -f sarif \
            -r gitleaks-fs.sarif
        continue-on-error: true   # collect both reports before failing

      - name: Scan git history for secrets
        # --log-opts limits scan to commits added by this PR (not all branches)
        run: |
          BASE_SHA=$(git merge-base HEAD origin/${{ github.base_ref }} 2>/dev/null || git rev-parse HEAD^)
          gitleaks detect \
            --config .security-tools/config/gitleaks.toml \
            --source . \
            --log-opts "${BASE_SHA}..HEAD" \
            --exit-code 1 \
            -f sarif \
            -r gitleaks-git.sarif
        continue-on-error: true   # collect both reports before failing

      - name: Upload gitleaks SARIF as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-sarif-${{ github.run_id }}
          path: |
            gitleaks-fs.sarif
            gitleaks-git.sarif
          retention-days: 14

      - name: Comment secrets findings on PR
        if: always() && github.event.pull_request.number != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request, urllib.error
          from collections import defaultdict

          def load_sarif(path):
              try:
                  return json.load(open(path))["runs"][0]["results"]
              except Exception:
                  return []

          fs_results  = load_sarif("gitleaks-fs.sarif")
          git_results = load_sarif("gitleaks-git.sarif")
          all_results = fs_results + git_results

          if not all_results:
              print("No secrets — skipping comment")
              exit(0)

          # Deduplicate by (file, line, rule)
          seen = set()
          rows = []
          for r in all_results:
              rule = r.get("ruleId", "unknown")
              loc  = r.get("locations", [{}])[0].get("physicalLocation", {})
              path = loc.get("artifactLocation", {}).get("uri", "?")
              line = loc.get("region", {}).get("startLine", "?")
              key  = (rule, path, str(line))
              if key in seen:
                  continue
              seen.add(key)
              rows.append((rule, path, line))

          lines = [
              "## 🔴 L1 · Gitleaks — PR Blocked",
              "",
              f"Found **{len(rows)} secret(s)** hardcoded in the repository.",
              "",
              "| Rule | File | Line |",
              "|------|------|------|",
          ]
          for rule, path, line in sorted(rows):
              lines.append(f"| `{rule}` | `{path}` | {line} |")

          lines += [
              "",
              "> **Action required:** Remove the exposed secret(s), rotate any leaked credentials, and re-push.",
              "> Use environment variables or a secret manager instead of hardcoding values.",
          ]

          body   = "\n".join(lines)
          token  = os.environ["GITHUB_TOKEN"]
          repo   = os.environ["REPO"]
          pr_num = os.environ["PR_NUMBER"]
          url    = f"https://api.github.com/repos/{repo}/issues/{pr_num}/comments"
          data   = json.dumps({"body": body}).encode()
          req    = urllib.request.Request(url, data=data, headers={
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "Content-Type": "application/json",
          })
          try:
              urllib.request.urlopen(req)
              print(f"  ✅ Secrets summary posted to PR #{pr_num}")
          except urllib.error.HTTPError as e:
              print(f"  ⚠️  Could not post comment: {e.code} {e.read().decode()}")
          EOF

      - name: Fail if secrets found
        # Re-check exit codes from both scans so the job fails correctly
        run: |
          FS_HITS=$(jq '.runs[0].results | length' gitleaks-fs.sarif  2>/dev/null || echo 0)
          GIT_HITS=$(jq '.runs[0].results | length' gitleaks-git.sarif 2>/dev/null || echo 0)
          TOTAL=$((FS_HITS + GIT_HITS))
          echo "Filesystem findings : $FS_HITS"
          echo "Git history findings: $GIT_HITS"
          echo "Total               : $TOTAL"
          if [ "$TOTAL" -gt 0 ]; then
            echo "❌ $TOTAL secret(s) detected — PR blocked"
            exit 1
          fi
          echo "✅ No secrets found"

  # ────────────────────────────────────────────────────────────────────────────
  # L2 · Trivy — SCA / CVE / Misconfigs
  # Blocks on CRITICAL or HIGH vulnerabilities in dependencies / IaC.
  # ────────────────────────────────────────────────────────────────────────────
  l2-trivy:
    name: "L2 · Trivy — SCA / CVE"
    runs-on: ubuntu-latest
    needs: l1-gitleaks
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout target code
        uses: actions/checkout@v4

      - name: Checkout security tools
        uses: actions/checkout@v4
        with:
          repository: politechielabs/organization-security-pipeline
          ref: main
          path: .security-tools
          token: ${{ secrets.RULES_REPO_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Initialize Trivy SARIF stub
        run: |
          echo '{"version":"2.1.0","runs":[{"tool":{"driver":{"name":"trivy","rules":[]}},"results":[]}]}' > trivy-results.sarif

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: "CRITICAL,HIGH"
          exit-code: "1"          # blocks PR on CRITICAL/HIGH
          ignore-unfixed: true    # skip CVEs with no upstream fix (reduces noise)
          skip-dirs: "config/community,config/gitlab,.git,node_modules,vendor,.venv"
          trivy-config: .security-tools/config/trivy-comprehensive.yaml

      - name: Upload Trivy SARIF as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-sarif-${{ github.run_id }}
          path: trivy-results.sarif
          retention-days: 14

      - name: Comment CVE findings on PR
        if: always() && github.event.pull_request.number != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request, urllib.error

          sarif = json.load(open("trivy-results.sarif"))
          results = sarif["runs"][0]["results"]

          if not results:
              print("No findings — skipping comment")
              exit(0)

          from collections import defaultdict
          by_pkg = defaultdict(list)
          for r in results:
              msg = r.get("message", {}).get("text", "")
              pkg = sev = cve = fixed = ""
              for line in msg.splitlines():
                  if line.startswith("Package:"):        pkg   = line.split(":",1)[1].strip()
                  if line.startswith("Severity:"):       sev   = line.split(":",1)[1].strip()
                  if line.startswith("Vulnerability"):   cve   = line.split(None,1)[1].strip() if " " in line else ""
                  if line.startswith("Fixed Version:"):  fixed = line.split(":",1)[1].strip()[:40]
              by_pkg[pkg].append((sev, cve, fixed))

          crit = sum(1 for r in results if "CRITICAL" in r.get("message",{}).get("text",""))
          high = len(results) - crit

          lines = [
              "## ❌ L2 · Trivy — PR Blocked",
              f"",
              f"Found **{crit} CRITICAL** and **{high} HIGH** CVEs in dependencies.",
              f"",
              f"| Package | Severity | CVE | Fix Available |",
              f"|---------|----------|-----|---------------|",
          ]
          for pkg, vulns in sorted(by_pkg.items()):
              for sev, cve, fixed in sorted(vulns, key=lambda x: (x[0] != "CRITICAL", x[1])):
                  icon = "🔴" if sev == "CRITICAL" else "🟠"
                  lines.append(f"| `{pkg}` | {icon} {sev} | {cve} | `{fixed or 'unknown'}` |")

          lines += [
              "",
              "> **Action required:** Update the packages listed above to the fixed versions before this PR can be merged.",
          ]

          body = "\n".join(lines)
          token  = os.environ["GITHUB_TOKEN"]
          repo   = os.environ["REPO"]
          pr_num = os.environ["PR_NUMBER"]
          url    = f"https://api.github.com/repos/{repo}/issues/{pr_num}/comments"
          data   = json.dumps({"body": body}).encode()
          req    = urllib.request.Request(url, data=data, headers={
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "Content-Type": "application/json",
          })
          try:
              urllib.request.urlopen(req)
              print(f"  ✅ CVE summary posted to PR #{pr_num}")
          except urllib.error.HTTPError as e:
              print(f"  ⚠️  Could not post comment: {e.code} {e.read().decode()}")
          EOF

  # ────────────────────────────────────────────────────────────────────────────
  # L3 · Semgrep — SAST (diff-aware)
  # Scans only changed source files. Blocks on ERROR-severity findings.
  # Rules live in .security-tools/config/semgrep-custom-rules (same repo).
  # ────────────────────────────────────────────────────────────────────────────
  l3-semgrep:
    name: "L3 · Semgrep — SAST"
    runs-on: ubuntu-latest
    needs: l2-trivy

    steps:
      - name: Checkout target code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout security tools
        uses: actions/checkout@v4
        with:
          repository: politechielabs/organization-security-pipeline
          ref: main
          path: .security-tools
          token: ${{ secrets.RULES_REPO_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Fetch base branch
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1

      - name: Identify changed source files
        run: |
          git diff --name-only origin/${{ github.base_ref }}...HEAD \
            | grep -E '\.(py|js|ts|jsx|tsx|java|go|rb|php|cs|swift|kt|rs|sh|bash|sql|yml|yaml|toml|xml|cfg|ini|json)$' \
            | while read -r f; do [ -f "$f" ] && printf '%s\n' "$f"; done \
            > /tmp/semgrep_targets.txt

          echo "Files queued for Semgrep ($(wc -l < /tmp/semgrep_targets.txt)):"
          cat /tmp/semgrep_targets.txt

      - name: Install Semgrep
        run: pip install semgrep==1.122.0

      - name: Run Semgrep
        run: |
          if [ ! -s /tmp/semgrep_targets.txt ]; then
            echo "No relevant files changed — skipping Semgrep"
            printf '{"version":"2.1.0","runs":[{"tool":{"driver":{"name":"semgrep","rules":[]}},"results":[]}]}\n' \
              > semgrep-results.sarif
            exit 0
          fi

          CONFIG_FLAGS="--config .security-tools/config/semgrep-custom-rules"

          mapfile -t TARGET_FILES < /tmp/semgrep_targets.txt

          semgrep $CONFIG_FLAGS \
            --severity ERROR \
            --error \
            --sarif --output semgrep-results.sarif \
            "${TARGET_FILES[@]}"

      - name: Upload Semgrep SARIF as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-sarif-${{ github.run_id }}
          path: semgrep-results.sarif
          retention-days: 14

      - name: Comment SAST findings on PR
        if: always() && github.event.pull_request.number != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request, urllib.error

          try:
              sarif = json.load(open("semgrep-results.sarif"))
              results = sarif["runs"][0]["results"]
          except Exception:
              results = []

          if not results:
              print("No SAST findings — skipping comment")
              exit(0)

          lines = [
              "## ❌ L3 · Semgrep — PR Blocked",
              "",
              f"Found **{len(results)} SAST finding(s)** in changed files.",
              "",
              "| Rule | File | Line | Message |",
              "|------|------|------|---------|",
          ]
          for r in results:
              rule = r.get("ruleId", "unknown").split(".")[-1]
              loc  = r.get("locations", [{}])[0].get("physicalLocation", {})
              path = loc.get("artifactLocation", {}).get("uri", "?")
              line = loc.get("region", {}).get("startLine", "?")
              msg  = r.get("message", {}).get("text", "")[:120].replace("|", "\\|").split("\n")[0]
              lines.append(f"| `{rule}` | `{path}` | {line} | {msg} |")

          lines += [
              "",
              "> **Action required:** Fix the issues above before this PR can be merged.",
          ]

          body   = "\n".join(lines)
          token  = os.environ["GITHUB_TOKEN"]
          repo   = os.environ["REPO"]
          pr_num = os.environ["PR_NUMBER"]
          url    = f"https://api.github.com/repos/{repo}/issues/{pr_num}/comments"
          data   = json.dumps({"body": body}).encode()
          req    = urllib.request.Request(url, data=data, headers={
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "Content-Type": "application/json",
          })
          try:
              urllib.request.urlopen(req)
              print(f"  ✅ SAST summary posted to PR #{pr_num}")
          except urllib.error.HTTPError as e:
              print(f"  ⚠️  Could not post comment: {e.code} {e.read().decode()}")
          EOF

  # ────────────────────────────────────────────────────────────────────────────
  # L4 · Claude — Semantic Triage + Semgrep Rule Generation
  # Runs run_reviewer.py --force against the caller's workspace.
  # --force bypasses L1-L3 gates (already enforced by the jobs above).
  # Claude posts INLINE review comments per finding — never blocks the PR.
  # CRITICAL/HIGH findings trigger automatic Semgrep rule generation + PR.
  # Skipped for security/ branches to prevent infinite rule-gen loops.
  # ────────────────────────────────────────────────────────────────────────────
  l4-claude:
    name: "L4 · Claude — Semantic Review + Rule Generation"
    runs-on: ubuntu-latest
    needs: l3-semgrep
    if: "!startsWith(github.head_ref, 'security/')"
    # continue even if findings are detected — L4 never blocks the PR
    continue-on-error: true
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout target code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout security tools
        uses: actions/checkout@v4
        with:
          repository: politechielabs/organization-security-pipeline
          ref: main
          path: .security-tools
          token: ${{ secrets.RULES_REPO_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install anthropic pyyaml python-dotenv semgrep==1.122.0

      - name: Install security tools (gitleaks + trivy, required by run_reviewer.py)
        run: |
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          tar -xzf gitleaks_8.24.3_linux_x64.tar.gz
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          sudo apt-get install -y wget apt-transport-https gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq && sudo apt-get install -y trivy

      - name: Claude semantic analysis + inline review + rule generation
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RULES_REPO_TOKEN: ${{ secrets.RULES_REPO_TOKEN }}
          SEMGREP_RULES_REPO: politechielabs/organization-security-pipeline
        run: python .security-tools/scripts/run_reviewer.py "$GITHUB_WORKSPACE" --force

      - name: Upload generated rules artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-semgrep-rules-${{ github.run_id }}
          path: /tmp/generated_rules.yml
          retention-days: 14
          if-no-files-found: ignore
